<style>

<div class="wrap">
  <header class="top">
    <div><h1 class="title">Enclume &amp; Errance</h1><div class="tag">Forge tes armes · Pars au combat · Reviens vivant</div></div>
    <div class="chips" id="chips"></div>
  </header>
  <nav id="nav">
    <button data-a="tab" data-v="forge">Forge</button>
    <button data-a="tab" data-v="exp">Expédition</button>
    <button data-a="tab" data-v="equip">Équipement</button>
    <button data-a="tab" data-v="skills">Compétences</button>
    <button data-a="tab" data-v="market">Marché</button>
    <button data-a="tab" data-v="rank">Classement</button>
  </nav>
  <main id="main" class="stack"></main>
  <div class="row small" style="justify-content:space-between;color:var(--ink2)"><span>Progression sauvegardée dans ce navigateur.</span><button class="btn sm wood" data-a="askreset">Recommencer une partie</button></div>
</div>
<div class="modal" id="modal" hidden><div class="frame" id="modalBody"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ================= utilitaires ================= */
const $=s=>document.querySelector(s);
const R=Math.random, rnd=(a,b)=>a+R()*(b-a), ri=(a,b)=>Math.floor(rnd(a,b+1)), pick=a=>a[Math.floor(R()*a.length)];
const r1=x=>Math.round(x*10)/10, clamp=(x,a,b)=>Math.max(a,Math.min(b,x)), lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const uid=()=>Math.random().toString(36).slice(2,10);
const roman=n=>{const v=[[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];let s='';for(const[a,b]of v)while(n>=a){s+=b;n-=a}return s};
const fmt=n=>n>=10000?(Math.round(n/100)/10)+'k':String(Math.round(n));
function shade(hex,a){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const f=c=>Math.round(a>0?c+(255-c)*a:c*(1+a));return'#'+[f(r),f(g),f(b)].map(x=>clamp(x,0,255).toString(16).padStart(2,'0')).join('')}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hsh=(i,s=0)=>{const x=Math.sin(i*127.1+s*311.7)*43758.5453;return x-Math.floor(x)};

/* ================= données ================= */
const RAR=['Commun','Peu commun','Rare','Épique','Légendaire','Mythique'];
const RCOL=['#c9c4b4','#6fd36a','#58b4ff','#c47cff','#ffc23a','#ff4f6e'];
const RBG=['#d9cfb4','#bfe6b4','#b8dcff','#e2c6ff','#ffe39a','#ffc2cc'];
const ORES=[
 {n:'Cuivre',c:'#d9874a'},{n:'Fer',c:'#9aa4ae'},{n:'Argent',c:'#e8eef3'},{n:'Mithril',c:'#7fdcf5'},

  parts.forEach(p=>PARTS[p.k].ap(it,p.r,tier));

  const x=R(),kind=forced||(x<0.34?'ore':x<0.54?'part':x<0.65?'bp':x<0.75?'mold':x<0.89?'frag':'potion');
  if(kind==='frag')return{t:'frag',q:ri(1,2)+zone+Math.floor(r/2)};
  if(kind==='ore')return{t:'ore',tier:oreTierFor(zone,depth,r),q:ri(2,4)+Math.floor(r/2)};
  if(kind==='part')return{t:'part',k:pick(Object.keys(PARTS)),r:Math.max(0,r-ri(0,1))};

}

  const notes=[];

    if(e.t==='ore')S.ores[e.tier]=(S.ores[e.tier]||0)+e.q;

    else if(e.t==='potion')S.potions+=e.q;
    else if(e.t==='frag')S.frag+=e.q;
    else if(e.t==='bp'){const cur=S.bps[e.type]||0;if(e.lvl>cur){S.bps[e.type]=e.lvl;notes.push(`Nouveau schéma : ${TYPES[e.type].n} rang ${roman(e.lvl)}`)}else{const g=10*e.lvl;S.gold+=g;notes.push(`Schéma ${TYPES[e.type].n} ${roman(e.lvl)} en double, revendu ${g} or`)}}

  if(c.ph==='opening'){c.open=Math.min(1,c.t/.55);if(c.t>.9+c.r*.18){c.ph='next'}}
  if(c.ph==='next'){c.idx++;if(c.idx>=c.L.length){c.ph='done';c.cur=null}else{c.cur=c.L[c.idx];c.ir=lootRar(c.cur);c.ph='rise';c.t=0}}

}

function prep(c){if(!c.dataset.w){c.dataset.w=c.width;c.dataset.h=c.height}const W=+c.dataset.w,H=+c.dataset.h,d=Math.min(2,window.devicePixelRatio||1);if(c.width!==Math.round(W*d)){c.width=Math.round(W*d);c.height=Math.round(H*d)}const g=c.getContext('2d');g.setTransform(d,0,0,d,0,0);return[g,W,H]}
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;const t=now/1000;
  try{
    mgUpdate(dt);let c;
    if((c=document.getElementById('forgeCv'))){const[g,W,H]=prep(c);drawForgeScene(g,W,H,t,dt)}
    if((c=document.getElementById('sceneCv'))){const[g,W,H]=prep(c);drawScene(g,W,H,t,dt)}
    if((c=document.getElementById('trailCv'))){const[g,W,H]=prep(c);drawTrail(g,W,H,t)}
    if((c=document.getElementById('mapCv'))){const[g,W,H]=prep(c);drawWorldMap(g,W,H,t)}
    if((c=document.getElementById('chestCv'))&&CH){const[g,W,H]=prep(c);chestUpdate(dt);if(CH)drawChestScene(g,W,H,t)}
    document.querySelectorAll('canvas.cardcv').forEach(cv=>{const[g,W,H]=prep(cv);drawCardFor(cv.dataset.card,g,W,H,t)});
  }catch(err){console.error(err)}
  requestAnimationFrame(loop);
}
