<style>
/* Layout : style cartoon à plat — fond lavande uni, contours épais teintés, une bande d'ombre nette, trame de points discrète. Monde visuel unique (pas de thème sombre/clair). */
:root{

  color-scheme:light;
}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}

.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

  text-shadow:3px 0 0 var(--ol),-3px 0 0 var(--ol),0 3px 0 var(--ol),0 -3px 0 var(--ol),2px 2px 0 var(--ol),-2px -2px 0 var(--ol),2px -2px 0 var(--ol),-2px 2px 0 var(--ol),0 6px 0 var(--ol)}

.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}

.frame{background:var(--dots),var(--panel);color:var(--ink);border:4px solid var(--ol);border-radius:16px;box-shadow:inset 0 -6px 0 #2a21400f,0 6px 0 var(--bgsh);padding:16px;min-width:0}

.muted{color:var(--ink2)} .small{font-size:.86rem}

.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}

(async()=>{
  if(!window.claude||!window.claude.use){LB.state='off';return}
  const to=setTimeout(()=>{if(LB.state==='loading'){LB.state='off';if(TAB==='rank')render()}},10000);
  try{
    const[db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user){clearTimeout(to);LB.state='off';if(TAB==='rank')render();return}
    LB.db=db;LB.user=user;LB.me=await user.id();LB.canWrite=await user.can('data.write');
    db.collection('classement').limit(500).onSnapshot(q=>{clearTimeout(to);LB.rows=q.docs.map(d=>Object.assign({id:d.id},d.data()));LB.state='ok';lbNames();if(TAB==='rank')render();else chips()},
      e=>{clearTimeout(to);LB.state='err';LB.err=e&&e.code;if(TAB==='rank')render()});
    pushScore();
  }catch(e){clearTimeout(to);LB.state='off';if(TAB==='rank')render()}
})();

  if(!LB.db||!LB.me||LB.canWrite===false)return;clearTimeout(LB.timer);
  LB.timer=setTimeout(()=>{const sc=myScore(),k=JSON.stringify(sc);if(k===LB.sent)return;LB.sent=k;
    LB.db.doc('classement/'+LB.me).set(Object.assign(sc,{t:Date.now()})).then(()=>{LB.err=null}).catch(e=>{LB.sent='';LB.err=e&&e.code;if(e&&(e.code==='permission_denied'||e.code==='not_granted'))LB.canWrite=false;if(TAB==='rank')render()})},2500);

/* Cinq gestes : fonte (taper le soufflet), coulée (remplir chaque cavité du moule), martelage (frapper les cibles sur la pièce chaude),

let MG=null;
const MGN=5,PHN=['Fonte','Coulée','Martelage','Trempe','Affûtage'],PHW=[.18,.2,.27,.15,.2];
const FX={smithX:640,smithTgt:640,embers:[],sparks:[],idleHit:0,steam:[]};
const PINFO={};
function pieceInfo(type){
  if(PINFO[type])return PINFO[type];
  const c=document.createElement('canvas').getContext('2d'),old=G;G=c;
  const L=silShapes(type).map(f=>{c.beginPath();f();c.closePath();const pts=[];let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
    for(let y=-64;y<=64;y+=2)for(let x=-64;x<=64;x+=2)if(c.isPointInPath(x,y)){pts.push([x,y]);x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)}
    return{f,pts,x0,x1,y0,y1,area:pts.length}});
  G=old;const all=L.flatMap(p=>p.pts);

}

function mgDown(px,py){

    let best=null;

}

/* martelage : cibles posées sur la pièce, l'anneau se resserre ; le métal refroidit */
const HAM={cx:470,cy:236,sc:3.1};
function hamK(){const pr=MG.hits.length/MG.nT;return[HAM.sc*lerp(1.18,1,pr),HAM.sc*lerp(.74,1,pr)]}
function hamC(){const A=artInfo(MG.type,MG.tier);return[(A.x0+A.x1)/2,(A.y0+A.y1)/2]}

const heatCol=x=>{const s=[[0,'#3a1a12'],[.3,'#a0261a'],[.55,'#f06a1e'],[.78,'#ffb43c'],[1,'#fff6d0']];x=clamp(x,0,1);for(let i=1;i<s.length;i++)if(x<=s[i][0]){const a=s[i-1],b=s[i],f=(x-a[0])/(b[0]-a[0]);const h1=parseInt(a[1].slice(1),16),h2=parseInt(b[1].slice(1),16);const m=k=>Math.round(((h1>>k)&255)*(1-f)+((h2>>k)&255)*f);return`rgb(${m(16)},${m(8)},${m(0)})`}return'#fff6d0'};

  }
  if(S.run.isl&&S.run.ph==='choice')return vIsle();
  const r=S.run,Z=ZONES[r.zone],s=stats();
  let prompt='',acts='';

  else if(r.ph==='combat'&&r.enemy){prompt='';
    acts=`<div class="cbtns"><button class="btn red" data-a="cact" data-v="atk" ${BUSY?'disabled':''}>${SV.atk}Frapper<small>attaque normale</small></button><button class="btn gold" data-a="cact" data-v="lourd" ${BUSY?'disabled':''}>${SV.heavy}Coup lourd<small>×1,7 · brise la garde</small></button><button class="btn" style="background:linear-gradient(#7cc4f0,#2f7ab8)" data-a="cact" data-v="parer" ${BUSY?'disabled':''}>${SV.def}Parer<small>contre coup puissant</small></button><button class="btn wood" data-a="cact" data-v="potion" ${BUSY||S.potions<1?'disabled':''}>${SV.pot}Potion (${S.potions})<small>+40 % PV</small></button></div>`}

function genIsland(zone,seed,layer){
  const W=60,H=42,rand=rng(seed),cw=9,ch=7,N1=[],N2=[];for(let i=0;i<(cw+1)*(ch+1);i++){N1.push(rand());N2.push(rand())}
  const noise=(A,x,y)=>{const fx=x/W*cw,fy=y/H*ch,ix=Math.floor(fx),iy=Math.floor(fy),tx=fx-ix,ty=fy-iy,v=(i,j)=>A[Math.min(ch,j)*(cw+1)+Math.min(cw,i)];return lerp(lerp(v(ix,iy),v(ix+1,iy),tx),lerp(v(ix,iy+1),v(ix+1,iy+1),tx),ty)};

  let sx=Math.floor(W/2),sy=H-3;while(sy>2&&t[sy*W+sx]!==1)sy--;for(let y=sy-2;y<=sy;y++)for(let x=sx-2;x<=sx+2;x++)if(y>0)t[y*W+x]=1;
  const P=IPAL[zone];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=y*W+x;if(t[i]!==1)continue;walk[i]=true;if(Math.hypot(x-sx,y-sy)<5)continue;if(rand()<[.05,.15,.08,.07,.07,.07][zone]){ob[i]=rand()<.25?'rock':P.ob;walk[i]=false}}

  for(let i=0;i<q.length;i++){const c=q[i],x=c%W,y=(c-x)/W;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const n=(y+dy)*W+x+dx;if(dist[n]<0&&walk[n]){dist[n]=dist[c]+1;q.push(n)}}}
  for(let i=0;i<W*H;i++)if(dist[i]<0)walk[i]=false;
  const maxD=Math.max(...dist);const far=q[q.length-1],bx=far%W,by=Math.floor(far/W);
  for(let y=by-2;y<=by+2;y++)for(let x=bx-2;x<=bx+2;x++){const i=y*W+x;if(t[i]===1&&dist[i]>=0){ob[i]=null;walk[i]=true}}
  const base=zone===5?layer*8:0,depthAt=i=>base+1+Math.min(7,Math.floor(dist[i]/maxD*8));
  const cand=q.filter(i=>dist[i]>6&&Math.hypot(i%W-bx,Math.floor(i/W)-by)>4);for(let i=cand.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[cand[i],cand[j]]=[cand[j],cand[i]]}
  const used=[],ents=[];let nid=0;
  const take=(sp)=>{for(let k=0;k<cand.length;k++){const c=cand[k];if(c<0)continue;const x=c%W,y=Math.floor(c/W);if(used.some(([ux,uy])=>Math.hypot(ux-x,uy-y)<sp))continue;cand[k]=-1;used.push([x,y]);return c}return null};
  const add=(type,sp,o={})=>{const c=take(sp);if(c==null)return;const x=c%W,y=Math.floor(c/W);ents.push(Object.assign({id:type[0]+(nid++),type,x:(x+.5)*TS,y:(y+.75)*TS,hx:(x+.5)*TS,hy:(y+.75)*TS,depth:depthAt(c)},o))};
  const foes=ZONES[zone].foes==='all'?FOES_ALL:ZONES[zone].foes;
  for(let k=0;k<16+layer*2;k++)add('enemy',3,{key:foes[Math.floor(rand()*foes.length)],f:1});
  for(let k=0;k<6;k++)add('chest',4,{mimic:rand()<.08,rs:rand()});
  for(let k=0;k<5;k++)add('vein',4);
  for(let k=0;k<2;k++)add('altar',6);for(let k=0;k<3;k++)add('bones',4);

function isleGround(m){const P=IPAL[m.zone],c=document.createElement('canvas');c.width=m.W*TS;c.height=m.H*TS;const g=c.getContext('2d'),W=m.W,old=G;G=g;

  G=old;return c}

  const t=e.target;
  if(t.closest&&t.closest('#mgBtn')){if(MG&&MG.ph<MGN){e.preventDefault();mgDown()}}
  else if(t.id==='forgeCv'&&MG&&MG.ph<MGN){e.preventDefault();const rc=t.getBoundingClientRect();mgDown((e.clientX-rc.left)/rc.width*960,(e.clientY-rc.top)/rc.height*440)}
  if(t.id==='hubCv'||t.id==='isleCv'){worldPointer(e,t);return}
  if(t.id==='mapCv'){const rc=t.getBoundingClientRect(),x=(e.clientX-rc.left)/rc.width*960,y=(e.clientY-rc.top)/rc.height*440;
    let best=-1,bd=80;ZONES.forEach((z,i)=>{const d=Math.hypot(z.mx-x,z.my-25-y);if(d<bd){bd=d;best=i}});if(best>=0&&best!==MAPSEL){MAPSEL=best;render()}}
});
document.addEventListener('pointerup',()=>{if(MG)mgUp()});
document.addEventListener('pointercancel',()=>{if(MG)mgUp()});
const worldOn=()=>$('#modal').hidden&&!CH&&!MG&&(TAB==='village'||(TAB==='exp'&&S.run&&S.run.isl&&S.run.ph==='choice'));
document.addEventListener('keydown',e=>{if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName))return;
  if(worldOn()){if(/^(Arrow|Key[WASDZQ])/.test(e.code)){KEYS[e.code]=true;if(e.code.startsWith('Arrow'))e.preventDefault()}
    if(['KeyE','Enter','Space'].includes(e.code)&&!e.repeat){e.preventDefault();ACT.interact();return}}});
document.addEventListener('keyup',e=>{KEYS[e.code]=false});
window.addEventListener('blur',()=>KEYS_clear());
document.addEventListener('keydown',e=>{if(CH&&(e.code==='Space'||e.code==='Enter')){e.preventDefault();if(!e.repeat)chestAdvance();return}if(e.code==='Space'&&MG&&MG.ph<MGN){e.preventDefault();if(!e.repeat)mgDown()}});
document.addEventListener('keyup',e=>{if(e.code==='Space'&&MG){e.preventDefault();mgUp()}});
render();
</script>
</body></html>
